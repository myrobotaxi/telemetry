# Fly.io deployment configuration for the telemetry server.
#
# Two public services:
#   - Tesla mTLS (port 443): TCP passthrough — Fly does NOT terminate TLS,
#     the app handles the mTLS handshake directly so it can read client certs.
#   - Client WebSocket (port 4443): Fly terminates TLS, proxies HTTP to app.
#
# Prometheus metrics (port 9090) is internal only — access via `fly proxy 9090`.
#
# Deploy: fly deploy
# Secrets: fly secrets set DATABASE_URL=... AUTH_SECRET=... ENCRYPTION_KEY=... TESLA_KEY_FILE_B64=...
# Generate ENCRYPTION_KEY with: openssl rand -base64 32 (see docs/contracts/key-rotation.md).
# Push (MYR-186): fly secrets set APNS_KEY_P8_B64=... APNS_KEY_ID=...
# Without both, push sends are skipped (the service still runs) — see docs/deployment.md.

app = 'my-robo-taxi-telemetry'
primary_region = 'iad'

# SIGTERM → SIGKILL budget for a deploy or a machine restart (MYR-410).
#
# Fly's default is 5s, which this server cannot shut down in — and blowing it
# means SIGKILL lands mid-drain and a rider's push is dropped silently, which is
# the exact failure MYR-410 exists to prevent. Note the grace_period under
# services.http_checks below is HEALTH-CHECK grace and has nothing to do with
# this; that mix-up is what set the budget wrong the first time.
#
# Worst-case arithmetic for the shutdown sequence, in execution order:
#
#   HTTP servers (internal/server.shutdownTimeout)         15s
#   consumer Stops, writer's two 10s flushes dominating    25s
#   shutdownDrainBudget in main.go: bus drain 5s + the
#     bounded push drains that follow it                   15s
#   db.Close and process teardown                           1s
#   --------------------------------------------------------
#   total worst case                                       56s
#
# 75s leaves headroom for a slow VM without letting a wedged shutdown stall a
# deploy indefinitely. Every step above is individually bounded, so the total is
# a real ceiling rather than an estimate. If you change any of those constants,
# change this with them.
kill_timeout = '75s'

[build]
  dockerfile = 'Dockerfile'

# Tesla mTLS — pure TCP passthrough (no TLS termination by Fly).
# Vehicles connect on port 443 (hardcoded in Tesla firmware).
# The app terminates TLS and extracts the VIN from the client cert.
# NO handlers — Fly passes raw TCP bytes so mTLS works end-to-end.
# NO health checks — TCP probes cause TLS EOF errors on the mTLS listener.
# internal_port 8443 because the app runs as non-root (can't bind <1024).
# Fly routes external 443 → internal 8443 transparently.
[[services]]
  internal_port = 8443
  protocol = 'tcp'

  [[services.ports]]
    port = 443

# Client WebSocket — Fly terminates TLS, proxies HTTP to internal port 8080.
# Browser clients connect on port 4443 for real-time telemetry.
# Also serves /healthz, /api/fleet-config/{vin}, and .well-known endpoint.
[[services]]
  internal_port = 8080
  protocol = 'tcp'

  [[services.ports]]
    port = 4443
    handlers = ['tls', 'http']

  [[services.http_checks]]
    interval = '10s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'
    port = 8080

# VM sizing — 512MB to handle mTLS + WebSocket + PostgreSQL connections.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
